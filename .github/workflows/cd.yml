name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v0.1.0). Required for manual/CD-from-Release runs."
        required: true
        type: string

permissions:
  contents: write
  actions: write
  id-token: write
  pages: write

concurrency:
  group: cd-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
    steps:
      - name: Resolve tag
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Tag must start with v (got: $TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ steps.refs.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG="$(uv run python -c 'from blender_mcp import __version__; print(__version__)')"
          echo "tag=$TAG_VERSION pkg=$PKG"
          test "$TAG_VERSION" = "$PKG"

      - name: Run tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    name: GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(needs.build.outputs.tag, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: vars.PUBLISH_PYPI == 'true'
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  pages:
    name: Refresh GitHub Pages (Astro)
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages workflow on main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # github-pages env only allows branch refs (e.g. main), not tags.
          # Release tags therefore cannot deploy Pages directly; refresh via Pages on main.
          gh workflow run pages.yml \
            --repo "${{ github.repository }}" \
            --ref main
          echo "Dispatched Pages workflow on main for ${{ needs.build.outputs.tag }}"

